{% include base_path %}
{% assign asset_version = site.asset_version | default: site.github.build_revision | default: site.time %}

<meta charset="utf-8">

{% include seo.html %}

{% include citation-meta.html %}

{% include structured-data.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<!-- http://t.co/dKP3o1e -->
<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
  // The wordmark ink-draw entrance plays only once per session.
{% if page.url == '/' %}  try {
    if (sessionStorage.getItem('lhc-ink-played')) {
      document.documentElement.classList.add('lhc-ink-done');
    } else {
      sessionStorage.setItem('lhc-ink-played', '1');
    }
  } catch (e) {}
{% endif %}</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css?v={{ asset_version | uri_escape }}">

<meta http-equiv="cleartype" content="on">
