{% comment %}Client-side search overlay. Opened via the masthead icon or the "/" key; backed by /search.json + Fuse.js.{% endcomment %}
<div id="search-overlay" class="search-overlay" role="dialog" aria-modal="true" aria-label="Site search">
  <div class="search-overlay__backdrop"></div>
  <div class="search-overlay__panel">
    <input id="search-input" class="search-overlay__input" type="search" autocomplete="off"
           placeholder="Search publications, news, pages…" aria-label="Search the site">
    <ul id="search-results" class="search-results" role="listbox" aria-label="Search results"></ul>
    <p class="search-overlay__hint"><kbd>/</kbd> open · <kbd>&uarr;</kbd><kbd>&darr;</kbd> navigate · <kbd>Enter</kbd> go · <kbd>Esc</kbd> close</p>
  </div>
</div>
